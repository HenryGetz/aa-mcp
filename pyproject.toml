[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aa-mcp"
version = "0.1.0"
description = "MCP server for artificialanalysis.ai — live AI model benchmarks, pricing, speed and provider data, token-efficient by design"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Henry Getz" }]
keywords = ["mcp", "artificial-analysis", "benchmarks", "llm", "model-comparison"]
dependencies = ["mcp>=2.0.0"]

[project.scripts]
aa-mcp = "aa_mcp.server:main"
aa-mcp-cli = "aa_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/HenryGetz/aa-mcp"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# E4/E7/E9 rather than all of "E": the codebase deliberately uses long descriptive
# lines and aligned literals in the table/reference text.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Typography is deliberate: "700 × 94", "Intel × Cost", en-dashes in labels.
  "RUF001", "RUF002", "RUF003",
  # Explicit list concatenation reads better than unpacking in the column builders.
  "RUF005",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert freely and spin up loopback servers.
"tests/*" = ["SIM117"]
"eval/*" = ["SIM117"]
# Scripts insert the repo on sys.path before importing the package.
"scripts/*" = ["SIM117", "E402"]

[tool.hatch.build.targets.wheel]
packages = ["src/aa_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
